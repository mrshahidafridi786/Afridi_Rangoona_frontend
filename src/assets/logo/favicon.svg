<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- AFRIDI RANGOONA Luxury Monogram Favicon -->
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C999"/>
      <stop offset="60%" stop-color="#C8A56A"/>
      <stop offset="100%" stop-color="#9C773D"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="32" height="32" rx="7" fill="#171717"/>
  
  <!-- Outer Diamond Border -->
  <rect x="16" y="3" width="18" height="18" rx="3" transform="rotate(45 16 3)" stroke="url(#favGold)" stroke-width="1.2" fill="#202020"/>
  
  <!-- Stylized AR Interlock -->
