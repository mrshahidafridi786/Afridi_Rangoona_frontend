  <path d="M16 12 C18 12 19.5 12.8 19.5 14 C19.5 15.2 18 16 16 16 Z" fill="#202020"/>
  <!-- Orange Accent R tail -->
  <path d="M18 17 L22 23 L19.2 23 L15.8 17 Z" fill="#C66A32"/>
